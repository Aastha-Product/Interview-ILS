# Pathfinder on one server (AWS Lightsail, or any Ubuntu machine with Docker): the app, its
# PostgreSQL database and Caddy, which gets the HTTPS certificate and passes requests on.
# setup.sh writes the .env next to this file; see docs/deploy-aws-lightsail.md.
#
#   docker compose up -d --build

name: pathfinder

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pathfinder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pathfinder
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathfinder -d pathfinder"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Built on the server from this repository (the Dockerfile's production stage).
    build:
      context: ../..
      target: production
    image: pathfinder-app:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &app-environment
      # Pathfinder: this container serves the pages; the worker below runs the background jobs
      # (resume analyses, documents, scoring) and the schedules, from the queue in the database.
      PATHFINDER_ROLE: web
      DATABASE_URL: postgresql://pathfinder:${POSTGRES_PASSWORD}@db:5432/pathfinder
      DOSSIER_PASSWORD: ${DOSSIER_PASSWORD:?Set DOSSIER_PASSWORD in .env (setup.sh makes it)}
      DOSSIER_SECRET: ${DOSSIER_SECRET:?Set DOSSIER_SECRET in .env}
      DOSSIER_PUBLIC_URL: https://${PATHFINDER_DOMAIN:?Set PATHFINDER_DOMAIN in .env}
      # Nightly backups run at 03:00 in this time zone.
      TZ: ${TZ:-Asia/Kolkata}
      # Students sign in with Firebase once its project is set (email and password, or Google),
      # else with Google once its client is set; until then, with the access code.
      PATHFINDER_SIGN_IN: ${PATHFINDER_SIGN_IN:-}
      PATHFINDER_FIREBASE_API_KEY: ${PATHFINDER_FIREBASE_API_KEY:-}
      PATHFINDER_FIREBASE_AUTH_DOMAIN: ${PATHFINDER_FIREBASE_AUTH_DOMAIN:-}
      PATHFINDER_FIREBASE_PROJECT_ID: ${PATHFINDER_FIREBASE_PROJECT_ID:-}
      DOSSIER_GOOGLE_CLIENT_ID: ${DOSSIER_GOOGLE_CLIENT_ID:-}
      DOSSIER_GOOGLE_CLIENT_SECRET: ${DOSSIER_GOOGLE_CLIENT_SECRET:-}
      # Startups reads company websites, so it's off unless set to on in .env.
      PATHFINDER_STARTUPS: ${PATHFINDER_STARTUPS:-off}
      # Dossier's job-search tools (Find jobs, the agent, applications, Inbox), on unless set to
      # off: off leaves students the resume analysis only.
      PATHFINDER_TOOLS: ${PATHFINDER_TOOLS:-on}
      # The server runs the AI, job search, scoring and Google for every student (on unless set
      # to off): students never choose a provider or enter a key. off is self-hosted Dossier.
      PATHFINDER_MANAGED: ${PATHFINDER_MANAGED:-on}
      # No usage ping from this server.
      DOSSIER_TELEMETRY: "off"
      # The AI every student uses (in managed mode, the only one).
      DOSSIER_AI_PROVIDER: ${DOSSIER_AI_PROVIDER:-}
      DOSSIER_AI_URL: ${DOSSIER_AI_URL:-}
      DOSSIER_AI_MODEL: ${DOSSIER_AI_MODEL:-}
      DOSSIER_AI_KEY: ${DOSSIER_AI_KEY:-}
      # AI requests per student per day on the shared key above; resets at midnight IST.
      PATHFINDER_AI_DAILY_LIMIT: ${PATHFINDER_AI_DAILY_LIMIT:-}
      # Who may open the admin console (/admin): the email addresses they sign in with, comma-separated.
      PATHFINDER_ADMIN_EMAILS: ${PATHFINDER_ADMIN_EMAILS:-}
      # Find jobs and the job agent, on the server's own job API key (licensed sources only).
      DOSSIER_JOBS_SOURCE: ${DOSSIER_JOBS_SOURCE:-}
      DOSSIER_JSEARCH_KEY: ${DOSSIER_JSEARCH_KEY:-}
      DOSSIER_JSEARCH_HOST: ${DOSSIER_JSEARCH_HOST:-}
      DOSSIER_ADZUNA_APP_ID: ${DOSSIER_ADZUNA_APP_ID:-}
      DOSSIER_ADZUNA_KEY: ${DOSSIER_ADZUNA_KEY:-}
      DOSSIER_FREEHIRE_URL: ${DOSSIER_FREEHIRE_URL:-}
      DOSSIER_JOBS_ARBEITSAGENTUR: ${DOSSIER_JOBS_ARBEITSAGENTUR:-off}
      # How postings are scored: ai (the AI above) or jev (needs DOSSIER_TYPESAFE_KEY).
      DOSSIER_SCORER: ${DOSSIER_SCORER:-}
      DOSSIER_TYPESAFE_KEY: ${DOSSIER_TYPESAFE_KEY:-}
      # On the shared Claude key: the model that reads resumes, and the backup for a busy model
      # (on another provider, e.g. Gemini, the backup only: one of its models, such as gemini-3.5-flash-lite).
      PATHFINDER_AI_READING_MODEL: ${PATHFINDER_AI_READING_MODEL:-}
      PATHFINDER_AI_FALLBACK_MODEL: ${PATHFINDER_AI_FALLBACK_MODEL:-}
      DOSSIER_BACKUP_RETENTION_DAYS: ${DOSSIER_BACKUP_RETENTION_DAYS:-}
      # Database connections each container keeps at most (default 20); app and worker together
      # stay well under Postgres's 100.
      PATHFINDER_DB_POOL: ${PATHFINDER_DB_POOL:-}
      # Background jobs the worker runs at once, and per student (defaults 10 and 2).
      PATHFINDER_JOB_CONCURRENCY: ${PATHFINDER_JOB_CONCURRENCY:-}
      PATHFINDER_JOBS_PER_STUDENT: ${PATHFINDER_JOBS_PER_STUDENT:-}
    # Not published: only Caddy reaches it, over the compose network.
    expose:
      - "3000"
    volumes:
      - data:/data
    # Room for Chromium, which prints the PDFs.
    mem_limit: 1g

  # Runs the background jobs and the schedules (PATHFINDER_ROLE=worker): the same image and
  # settings as the app, started once the app has brought the database up to date. Caddy never
  # sends it requests. Restarting the app no longer stops jobs; queued ones wait here.
  worker:
    image: pathfinder-app:local
    # Built by the app's build (or setup.sh), never pulled.
    pull_policy: never
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      <<: *app-environment
      PATHFINDER_ROLE: worker
    volumes:
      # The zips and backups it writes are served by the app.
      - data:/data
    # Room for Chromium, which zips the PDFs.
    mem_limit: 1g

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PATHFINDER_DOMAIN: ${PATHFINDER_DOMAIN}
      # For Firebase's sign-in pages under this domain (see the Caddyfile).
      PATHFINDER_FIREBASE_PROJECT_ID: ${PATHFINDER_FIREBASE_PROJECT_ID:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  data:
  caddy_data:
  caddy_config:
