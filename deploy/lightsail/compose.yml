# Pathfinder on one server (AWS Lightsail, or any Ubuntu machine with Docker): the app, its
# PostgreSQL database and Caddy, which gets the HTTPS certificate and passes requests on.
# setup.sh writes the .env next to this file; see docs/deploy-aws-lightsail.md.
#
#   docker compose up -d --build

name: pathfinder

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pathfinder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pathfinder
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathfinder -d pathfinder"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Built on the server from this repository (the Dockerfile's production stage).
    build:
      context: ../..
      target: production
    image: pathfinder-app:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pathfinder:${POSTGRES_PASSWORD}@db:5432/pathfinder
      DOSSIER_PASSWORD: ${DOSSIER_PASSWORD:?Set DOSSIER_PASSWORD in .env (setup.sh makes it)}
      DOSSIER_SECRET: ${DOSSIER_SECRET:?Set DOSSIER_SECRET in .env}
      DOSSIER_PUBLIC_URL: https://${PATHFINDER_DOMAIN:?Set PATHFINDER_DOMAIN in .env}
      # Nightly backups run at 03:00 in this time zone.
      TZ: ${TZ:-Asia/Kolkata}
      # Students sign in with Firebase once its project is set (email and password, or Google),
      # else with Google once its client is set; until then, with the access code.
      PATHFINDER_SIGN_IN: ${PATHFINDER_SIGN_IN:-}
      PATHFINDER_FIREBASE_API_KEY: ${PATHFINDER_FIREBASE_API_KEY:-}
      PATHFINDER_FIREBASE_AUTH_DOMAIN: ${PATHFINDER_FIREBASE_AUTH_DOMAIN:-}
      PATHFINDER_FIREBASE_PROJECT_ID: ${PATHFINDER_FIREBASE_PROJECT_ID:-}
      DOSSIER_GOOGLE_CLIENT_ID: ${DOSSIER_GOOGLE_CLIENT_ID:-}
      DOSSIER_GOOGLE_CLIENT_SECRET: ${DOSSIER_GOOGLE_CLIENT_SECRET:-}
      # Startups reads company websites, so it's off unless set to on in .env.
      PATHFINDER_STARTUPS: ${PATHFINDER_STARTUPS:-off}
      # Dossier's job-search tools, off unless set to on: students see the resume analysis only.
      PATHFINDER_TOOLS: ${PATHFINDER_TOOLS:-off}
      # No usage ping from this server.
      DOSSIER_TELEMETRY: "off"
      # Optional defaults for Settings → AI provider; each student can set their own.
      DOSSIER_AI_PROVIDER: ${DOSSIER_AI_PROVIDER:-}
      DOSSIER_AI_URL: ${DOSSIER_AI_URL:-}
      DOSSIER_AI_MODEL: ${DOSSIER_AI_MODEL:-}
      DOSSIER_AI_KEY: ${DOSSIER_AI_KEY:-}
      # AI requests per student per day on the shared key above; resets at midnight IST.
      PATHFINDER_AI_DAILY_LIMIT: ${PATHFINDER_AI_DAILY_LIMIT:-}
      DOSSIER_BACKUP_RETENTION_DAYS: ${DOSSIER_BACKUP_RETENTION_DAYS:-}
    # Not published: only Caddy reaches it, over the compose network.
    expose:
      - "3000"
    volumes:
      - data:/data
    # Room for Chromium, which prints the PDFs.
    mem_limit: 1g

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PATHFINDER_DOMAIN: ${PATHFINDER_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  data:
  caddy_data:
  caddy_config:
