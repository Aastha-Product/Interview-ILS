# OPTIONAL local services for people who prefer Docker. Not for production.
#
# The default setup needs no Docker: `pnpm services:up` runs an embedded Postgres and files are
# stored in .local/storage (STORAGE_DRIVER=local). Use this file only if you want Docker instead:
#
#   docker compose -f infra/docker-compose.yml up -d --wait
#
# Postgres listens on 5432 with the same user, password and databases as .env.example, so do not
# run it at the same time as `pnpm services:up`.
# MinIO is S3-compatible. To use it, set in .env:
#   STORAGE_DRIVER=s3
#   S3_ENDPOINT=http://localhost:9000
#   S3_BUCKET=pathfinder
#   S3_ACCESS_KEY=minio
#   S3_SECRET_KEY=minio123
name: pathfinder

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pathfinder
      POSTGRES_PASSWORD: pathfinder
      POSTGRES_DB: pathfinder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathfinder -d pathfinder"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates the private bucket once MinIO is up, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio123 &&
      mc mb --ignore-existing local/pathfinder &&
      mc anonymous set none local/pathfinder
      "
    restart: "no"

volumes:
  pgdata:
  miniodata:
