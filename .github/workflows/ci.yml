name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env from the example (no real keys; AI and feeds use mocks)
        run: |
          cp .env.example .env
          sed -i "s|^AUTH_SECRET=.*|AUTH_SECRET=$(openssl rand -hex 32)|" .env

      - name: Start local Postgres (embedded, no Docker)
        run: pnpm services:up

      - name: Apply migrations
        run: pnpm db:deploy
        # The integration tests migrate TEST_DATABASE_URL themselves (test/integration-global-setup.ts).

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The worker's PDF tests (apps/worker/test/pdf.test.ts) render with a real Chromium.
      - name: Install Playwright Chromium
        run: pnpm --filter @pathfinder/e2e install-browsers --with-deps

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

      - name: Postgres log on failure
        if: failure()
        run: cat .local/pg.log || true

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env from the example (no real keys; AI and feeds use mocks)
        run: |
          cp .env.example .env
          sed -i "s|^AUTH_SECRET=.*|AUTH_SECRET=$(openssl rand -hex 32)|" .env

      - name: Start local Postgres (embedded, no Docker)
        run: pnpm services:up

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Install Playwright Chromium
        run: pnpm --filter @pathfinder/e2e install-browsers --with-deps

      - name: Run end-to-end tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Postgres log on failure
        if: failure()
        run: cat .local/pg.log || true
