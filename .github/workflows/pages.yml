name: Pages

# Publishes the website in site/ to GitHub Pages. Settings → Pages → Source must be
# "GitHub Actions".
#
# Pathfinder: site/ is upstream Dossier's own website, not Pathfinder's, so this runs only when
# started by hand (Actions → Pages → Run workflow), never on a push to main.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: site/build.sh _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
